[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-earshot"
version = "0.1.0"
description = "Hermes plugin: hear when a machine drifts from its own healthy sound."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raphael Rairo" }]
keywords = ["hermes", "audio", "anomaly-detection", "robotics", "predictive-maintenance"]
dependencies = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "onnx>=1.15,<2",
  "soundfile>=0.12,<0.15",
  "Pillow>=10.1,<14",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4,<0.6"]
dev = ["pytest>=8,<10", "scikit-learn>=1.4,<2", "pyyaml>=6,<7"]

[project.scripts]
earshot = "earshot_core.__main__:main"

[project.urls]
Homepage = "https://github.com/rapha18th/earshot"

[tool.setuptools.packages.find]
include = ["earshot_core*"]

[tool.setuptools.package-data]
earshot_core = ["models/*.onnx"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
