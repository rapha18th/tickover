[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tickover"
version = "0.4.0"
description = "Hermes plugin: ears for an agent. Hear a sound, verify an action, catch a machine drifting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raphael Rairo" }]
keywords = ["hermes", "audio", "anomaly-detection", "robotics", "predictive-maintenance"]
dependencies = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "onnx>=1.15,<2",
  "soundfile>=0.12,<0.15",
  "Pillow>=10.1,<14",
  "imageio-ffmpeg>=0.4.9,<1",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4,<0.6"]
dev = ["pytest>=8,<10", "scikit-learn>=1.4,<2", "pyyaml>=6,<7"]

[project.scripts]
tickover = "tickover_core.__main__:main"

[project.urls]
Homepage = "https://github.com/rapha18th/tickover"

[tool.setuptools.packages.find]
include = ["tickover_core*"]

[tool.setuptools.package-data]
tickover_core = ["models/*.onnx", "*.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
