name: nzeve
version: "0.2.0"
description: >-
  A listening routine for machines with no sensors. Hermes learns a generator,
  borehole pump, compressor, fan or old car from a few healthy recordings, asks
  its owner every week on Telegram or WhatsApp for a 10-second voice note,
  checks it against that machine's own normal, tracks the drift trend, forecasts
  when it crosses the alert line, and sends a fleet card. Frozen CED and
  EfficientAT encoders in onnxruntime, few-shot, local. Nzeve is Shona for ear.
author: rapha18th
license: MIT
homepage: https://github.com/rapha18th/nzeve
tags:
  - audio
  - predictive-maintenance
  - anomaly-detection
  - cron
  - skills
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
provides_tools:
  - nzeve_enroll
  - nzeve_check
  - nzeve_watch
  - nzeve_checkin
  - nzeve_fleet
  - nzeve_listen
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
provides_middleware: []
requires_env: []
# Kept in step with pyproject.toml. pyproject.toml is what Hermes installs.
python_dependencies:
  - "numpy>=1.26,<3"
  - "onnxruntime>=1.17,<2"
  - "onnx>=1.15,<2"
  - "soundfile>=0.12,<0.15"
  - "Pillow>=10.1,<14"
