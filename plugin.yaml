name: tickover
version: "0.4.0"
description: >-
  Ears for Hermes. Hermes can switch things on; now it can hear whether they
  started. Hear any recording and say what it sounds like. Verify an action by
  sound: before, act, after. Remember a machine from a few healthy recordings
  and catch it drifting, from a weekly voice note or an unattended microphone,
  with a trend, a forecast and a fleet card. Teach it new questions in the
  owner's words. Frozen CED and EfficientAT encoders in onnxruntime, few-shot,
  local, no keys. Tickover is what mechanics call an engine at idle.
author: rapha18th
license: MIT
homepage: https://github.com/rapha18th/tickover
tags:
  - audio
  - predictive-maintenance
  - anomaly-detection
  - cron
  - verification
  - iot
  - skills
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
provides_tools:
  - tickover_hear
  - tickover_verify
  - tickover_enroll
  - tickover_check
  - tickover_teach
  - tickover_watch
  - tickover_checkin
  - tickover_fleet
  - tickover_listen
  - tickover_selftest
provides_hooks:
  - pre_gateway_dispatch
  - post_gateway_admission
  - pre_llm_call
provides_middleware: []
requires_env: []
# Read with ctx.get_config("allowed_sources") from plugins.entries.tickover.settings.
config_schema:
  allowed_sources:
    type: list
    default: []
    label: Allowed listening devices
    description: >-
      Hosts Tickover may open stream URLs from, as host or host:port, for example 192.168.1.20:8765 or
      pi.local. Empty allows no URLs; files on this computer always work. A local name or an IP address
      may be on your network. Any other name must resolve to public addresses.
# Kept in step with pyproject.toml. pyproject.toml is what Hermes installs.
python_dependencies:
  - "numpy>=1.26,<3"
  - "onnxruntime>=1.17,<2"
  - "onnx>=1.15,<2"
  - "soundfile>=0.12,<0.15"
  - "Pillow>=10.1,<14"
  - "imageio-ffmpeg>=0.4.9,<1"
